<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rhythm Game - Base Project</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ================= MAIN MENU ================= -->
  <section id="menu-screen" class="screen active">
    <div class="crt-overlay"></div>
    <h1 class="title">RHYTHM BASE</h1>

    <div class="carousel">
      <button id="carousel-prev" class="carousel-arrow" aria-label="Previous song">&#10094;</button>

      <div class="song-card">
        <div id="song-cover" class="song-cover">
          <span id="song-cover-letter">?</span>
        </div>
        <div class="song-info">
          <h2 id="song-name">Song</h2>
          <div id="song-index" class="song-index">1 / 1</div>
        </div>
      </div>

      <button id="carousel-next" class="carousel-arrow" aria-label="Next song">&#10095;</button>
    </div>

    <div class="carousel-dots" id="carousel-dots"></div>

    <div class="diff-buttons">
      <button class="diff-btn" data-diff="easy"><span class="diff-stars">&#9733;</span>EASY</button>
      <button class="diff-btn selected" data-diff="normal"><span class="diff-stars">&#9733;&#9733;</span>NORMAL</button>
      <button class="diff-btn" data-diff="hard"><span class="diff-stars">&#9733;&#9733;&#9733;</span>HARD</button>
    </div>

    <button id="play-btn">PLAY</button>

    <p class="hint">D F J K to hit notes &nbsp;|&nbsp; &#8592; &#8594; to change song</p>
  </section>

  <!-- ================= GAME SCREEN ================= -->
  <section id="game-screen" class="screen">
    <div id="hud">
      <div id="score-display">SCORE: 0</div>
      <div id="combo-display"></div>
      <div id="accuracy-display">ACC: 100%</div>
    </div>

    <div id="track-container">
      <div id="countdown-display"></div>
      <div id="hit-zone"></div>
      <div class="lane" data-lane="0"><div class="receptor" data-lane="0"></div></div>
      <div class="lane" data-lane="1"><div class="receptor" data-lane="1"></div></div>
      <div class="lane" data-lane="2"><div class="receptor" data-lane="2"></div></div>
      <div class="lane" data-lane="3"><div class="receptor" data-lane="3"></div></div>
    </div>

    <div id="progress-bar-container">
      <div id="progress-bar-fill"></div>
    </div>
  </section>

  <!-- ================= RESULTS SCREEN ================= -->
  <section id="results-screen" class="screen">
    <h1>RESULTS</h1>
    <div class="results-box">
      <p>Score: <span id="result-score">0</span></p>
      <p>Max Combo: <span id="result-combo">0</span></p>
      <p>Accuracy: <span id="result-accuracy">0%</span></p>
      <p id="result-rank"></p>
    </div>
    <button id="back-to-menu-btn">BACK TO MENU</button>
  </section>

  <audio id="song-audio"></audio>

  <script src="game/menu/menu.js"></script>
  <script src="game/ingame/game.js"></script>
</body>
</html>
